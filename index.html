<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#071d27">
<title>Captain Kincheloe — Version 5</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:#061a23;font-family:Trebuchet MS,Arial,sans-serif;overflow:hidden;overscroll-behavior:none}body{display:grid;place-items:center}#shell{position:relative;width:min(100vw,540px);height:100dvh;max-height:900px;overflow:hidden;background:#78d4ed;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 0 45px #000a}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}#hud{position:absolute;left:6px;right:6px;top:calc(6px + env(safe-area-inset-top,0px));display:grid;grid-template-columns:repeat(4,1fr);gap:4px;pointer-events:none}.pill{background:#082733e8;border:1px solid #ffffff80;border-radius:11px;color:#fff;text-align:center;padding:4px 3px;font-weight:900;text-shadow:0 2px 2px #000;font-size:12px}#tensionBox{position:absolute;left:10px;right:10px;top:calc(54px + env(safe-area-inset-top,0px));height:22px;background:#071a24db;border:2px solid #ffffff80;border-radius:999px;overflow:hidden;display:none}#tensionFill{height:100%;width:0;background:linear-gradient(90deg,#5cc95d,#f5d34d 62%,#ef493e)}#tensionLabel{position:absolute;inset:0;text-align:center;color:#fff;font-weight:900;font-size:11px;line-height:18px;text-shadow:0 1px 2px #000}#fishCard{position:absolute;right:8px;top:calc(82px + env(safe-area-inset-top,0px));width:44%;background:#082733e8;color:#fff;border:1px solid #ffffff80;border-radius:12px;padding:6px 8px;text-align:center;font-weight:900;display:none;pointer-events:none;font-size:12px}#fishCard small{display:block;font-weight:700}#message{position:absolute;left:50%;top:calc(118px + env(safe-area-inset-top,0px));transform:translateX(-50%);max-width:88%;background:#092e3cf0;color:#fff;border:2px solid #ffffff88;border-radius:13px;padding:8px 11px;text-align:center;font-weight:900;opacity:0;transition:opacity .18s;pointer-events:none;font-size:13px}#lureBar{position:absolute;left:7px;right:7px;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:none;gap:5px;justify-content:center}.lureBtn{border:1px solid #ffffffaa;border-radius:11px;background:#0d3543e9;color:white;padding:7px 8px;font-weight:900;font-size:10px;min-width:22%}.lureBtn.active{outline:3px solid #ffd25c;background:#19576c}#bottom{position:absolute;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:center;gap:7px;padding:0 8px}button{border:2px solid #fff0bf;border-radius:15px;padding:12px 14px;font:900 16px Trebuchet MS,Arial;background:linear-gradient(#ffc457,#e98c16);color:#25160b;box-shadow:0 4px 0 #6e3b10,0 7px 14px #0005;touch-action:manipulation}button:active{transform:translateY(2px);box-shadow:0 2px 0 #6e3b10}#cast,#reel{min-width:37%}#reel{background:linear-gradient(#a9eb83,#4fb45a);box-shadow:0 4px 0 #255e2b,0 7px 14px #0005}#pause{min-width:50px;background:linear-gradient(#d8e6ee,#8099a7);box-shadow:0 4px 0 #3e5966}#overlay{position:absolute;inset:0;background:#061f2ce8;display:grid;place-items:center;padding:12px;color:#fff;text-align:center;overflow:auto}#panel{width:min(96%,500px);background:#0d3543f2;border:2px solid #ffffff8c;border-radius:22px;padding:14px;box-shadow:0 18px 45px #0009}h1{margin:4px 0 2px;color:#ffc34b;font-size:34px;line-height:.95;text-shadow:0 3px 0 #6c3a0f}h2{margin:7px 0;color:#ffd776;font-size:20px}h3{margin:9px 0 5px;color:#fff0bd;font-size:17px}p{margin:7px 0;line-height:1.25;font-size:14px}.small{font-size:12px;opacity:.84}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:9px 0}.card{background:#123f50;border:1px solid #ffffff55;border-radius:12px;padding:8px 6px}.card b{display:block;color:#ffd674}.card.active{outline:3px solid #ffd25c;background:#19576c}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}.stat{background:#123f50;border-radius:10px;padding:7px}.flex{display:flex;justify-content:center;flex-wrap:wrap;gap:7px;margin-top:8px}.list{background:#123f50;border-radius:12px;padding:8px;margin:8px 0;text-align:left;max-height:32vh;overflow:auto}.line{padding:5px 0;border-bottom:1px solid #ffffff22}.line:last-child{border-bottom:none}.bigLoss{font-size:25px;color:#ffcc57;text-shadow:0 3px 0 #6c3a0f}@media (min-height:800px){button{font-size:18px;padding:13px 16px}.pill{font-size:13px}}
</style>
</head>
<body>
<div id="shell"><canvas id="game"></canvas><div id="hud"><div class="pill">Score<br><span id="score">0</span></div><div class="pill">Time<br><span id="time">105</span></div><div class="pill">Coins<br><span id="coins">0</span></div><div class="pill">Gear<br><span id="gearHud">Ice</span></div></div><div id="tensionBox"><div id="tensionFill"></div><div id="tensionLabel">LINE TENSION</div></div><div id="fishCard"></div><div id="message"></div><div id="lureBar">
  <button class="lureBtn active" data-lure="worm">🪱 Worm <span id="cntWorm">FREE</span></button>
  <button class="lureBtn" data-lure="spinner">🟡 Spinner <span id="cntSpinner"></span></button>
  <button class="lureBtn" data-lure="spoon">🥄 Spoon <span id="cntSpoon"></span></button>
  <button class="lureBtn" data-lure="jig">🔴 Jig <span id="cntJig"></span></button>
</div>
<div id="bottom"><button id="cast">🎣 CAST</button><button id="reel">⬆ REEL</button><button id="pause">Ⅱ</button></div><div id="overlay"><div id="panel"></div></div></div>
<script>
(()=>{"use strict";
const shell=document.getElementById('shell'),C=document.getElementById('game'),ctx=C.getContext('2d',{alpha:false}),overlay=document.getElementById('overlay'),panel=document.getElementById('panel'),bottom=document.getElementById('bottom'),lureBar=document.getElementById('lureBar'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),coinsEl=document.getElementById('coins'),gearHud=document.getElementById('gearHud'),tensionBox=document.getElementById('tensionBox'),tensionFill=document.getElementById('tensionFill'),fishCard=document.getElementById('fishCard'),message=document.getElementById('message'),castBtn=document.getElementById('cast'),reelBtn=document.getElementById('reel'),pauseBtn=document.getElementById('pause');
let W=540,H=720,dpr=1,waterTop=260;
function resize(){const r=shell.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);W=Math.max(320,Math.round(r.width));H=Math.max(520,Math.round(r.height));C.width=Math.round(W*dpr);C.height=Math.round(H*dpr);C.style.width=W+'px';C.style.height=H+'px';ctx.setTransform(dpr,0,0,dpr,0,0);waterTop=Math.round(H*.37)} resize();addEventListener('resize',resize,{passive:true});
const species={
salmon:{name:"Silver Salmon",min:5,max:15,power:.78,stamina:92,value:15,color:"#c9d8de",likes:["spinner","spoon","worm"],style:"hard surges"},
trout:{name:"Rainbow Trout",min:1.5,max:7,power:.30,stamina:30,value:8,color:"#8cc6b2",likes:["spinner","worm"],style:"quick darts"},
cod:{name:"Pacific Cod",min:6,max:30,power:.82,stamina:105,value:14,color:"#9c927a",likes:["jig","worm"],style:"stubborn head shakes",rodThief:.24},
halibut:{name:"Pacific Halibut",min:18,max:95,power:1.12,stamina:175,value:28,color:"#81766c",likes:["jig","worm"],style:"heavy runs",rodThief:.58}
};
const gears={
ice:{name:"Basic Ice Rod",short:"Ice",cost:0,tolerance:100,reel:1.00,rodRisk:1.00},
stout:{name:"Stout Ice Rod",short:"Stout",cost:120,tolerance:122,reel:1.10,rodRisk:.62},
boat:{name:"Heavy Boat Rod",short:"Boat",cost:280,tolerance:148,reel:1.18,rodRisk:.34}
};
const lures={
worm:{name:"Worm + Hook",cost:0,start:999},
spinner:{name:"Spinner",cost:14,start:5},
spoon:{name:"Spoon",cost:18,start:3},
jig:{name:"Jig",cost:22,start:4}
};
const defaults={coins:70,best:0,totalFish:0,biggest:null,ownedGear:['ice'],selectedGear:'ice',rodOwned:true,lures:{worm:999,spinner:5,spoon:3,jig:4},records:{},rodLosses:0,lostGear:null};
let save=load();function load(){try{const v=JSON.parse(localStorage.getItem('CK_V5_mobile')||'null');return Object.assign({},defaults,v||{},{lures:Object.assign({},defaults.lures,(v&&v.lures)||{}),records:Object.assign({},(v&&v.records)||{})})}catch(e){return JSON.parse(JSON.stringify(defaults))}}function persist(){try{localStorage.setItem('CK_V5_mobile',JSON.stringify(save))}catch(e){}}
let running=false,paused=false,state='idle',score=0,timeLeft=105,last=0,selectedLure='spinner',hook={x:270,y:300},fish=null,reeling=false,tension=0,toastTimer=0,roundCaught=0,rodLossThisRound=0,spawnTimer=0,ambientFish=[];
const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));function gear(){return gears[save.selectedGear]||gears.ice}function fmtWeight(w){return w<10?w.toFixed(1)+' lb':Math.round(w)+' lb'}function menuButton(label,id){return `<button id="${id}">${label}</button>`}
function updateHUD(){scoreEl.textContent=score;timeEl.textContent=Math.max(0,Math.ceil(timeLeft));coinsEl.textContent=save.coins;gearHud.textContent=save.rodOwned?gear().short:'NO ROD';for(const k of Object.keys(lures)){const el=document.getElementById('cnt'+k[0].toUpperCase()+k.slice(1));if(el)el.textContent=(k==='worm'?'FREE':'x'+(save.lures[k]||0))}}
function toast(t,ms=1450){message.textContent=t;message.style.opacity=1;clearTimeout(toastTimer);toastTimer=setTimeout(()=>message.style.opacity=0,ms)}function showFish(){if(!fish){fishCard.style.display='none';return}fishCard.style.display='block';fishCard.innerHTML=`${fish.name}<small>${fmtWeight(fish.weight)} · ${fish.style}<br>Stamina ${Math.max(0,Math.ceil(fish.stamina))}</small>`}
function renderMenu(){running=false;paused=false;state='idle';fish=null;reeling=false;bottom.style.display='none';lureBar.style.display='none';tensionBox.style.display='none';fishCard.style.display='none';overlay.style.display='grid';updateHUD();panel.innerHTML=`<h1>Captain Kincheloe</h1><h2>Version 5.6 — Give It Hell</h2><p><b>Trout can be bullied. Silvers and cod fight. Halibut are a problem.</b> If you're broke, the ice rod and worm are always free. And yes, a fish can steal the whole damn rod.</p><div class="stats"><div class="stat"><b>Coins</b><br>${save.coins}</div><div class="stat"><b>Total fish</b><br>${save.totalFish}</div><div class="stat"><b>Best score</b><br>${save.best}</div><div class="stat"><b>Rods lost</b><br>${save.rodLosses}</div></div><div class="flex">${menuButton(save.rodOwned?'PLAY':'NO ROD — SHOP','play')}${menuButton('SHOP','shop')}${menuButton('RECORDS','records')}${menuButton('HOW TO PLAY','how')}</div><p class="small">Built light on purpose. Phone-first. No external libraries.</p>`;document.getElementById('play').onclick=()=>save.rodOwned?startRound():renderShop();document.getElementById('shop').onclick=renderShop;document.getElementById('records').onclick=renderRecords;document.getElementById('how').onclick=renderHow}
function renderHow(){panel.innerHTML=`<h1>How to Fish</h1><div class="list"><div class="line"><b>1. Choose a lure.</b> Fish have preferences.</div><div class="line"><b>2. CAST.</b> A fish may strike after the lure drops.</div><div class="line"><b>3. Hold REEL to gain line.</b> Release it when tension gets ugly.</div><div class="line"><b>4. Tire the fish.</b> Pressure drains stamina. Back off and a live fish can recover.</div><div class="line"><b>5. Zero stamina means zero fight.</b> The fish becomes dead weight: still heavy, but it cannot run or recover.</div><div class="line"><b>6. Don't redline it.</b> A hard halibut—or humiliatingly, a cod—can take the whole rod.</div><div class="line"><b>7. Lost lure?</b> Buy another. <b>Lost rod?</b> Same rule, more swearing.</div></div><div class="flex">${menuButton('BACK','back')}</div>`;document.getElementById('back').onclick=renderMenu}
function renderRecords(){const rows=Object.entries(save.records).sort((a,b)=>b[1]-a[1]).map(([n,w])=>`<div class="line"><b>${n}</b> — ${fmtWeight(w)}</div>`).join('')||'<div class="line">No fish yet.</div>';panel.innerHTML=`<h1>Records</h1><div class="list">${rows}</div><div class="flex">${menuButton('BACK','back')}</div>`;document.getElementById('back').onclick=renderMenu}
function renderShop(){overlay.style.display='grid';bottom.style.display='none';lureBar.style.display='none';const gCards=Object.entries(gears).map(([id,g])=>{const owned=save.ownedGear.includes(id),active=save.selectedGear===id;return `<div class="card ${active?'active':''}"><b>${g.name}</b><span class="small">Tension ${g.tolerance} · reel x${g.reel.toFixed(2)}</span><br><button class="gearBtn" data-id="${id}">${owned?(active?'EQUIPPED':'EQUIP'):'BUY '+g.cost}</button></div>`}).join('');const lureCards=Object.entries(lures).map(([id,l])=>id==='worm'?`<div class="card"><b>${l.name}</b><span class="small">Always available</span><br><button disabled>FREE</button></div>`:`<div class="card"><b>${l.name}</b><span class="small">Owned: ${save.lures[id]||0}</span><br><button class="buyLure" data-id="${id}">BUY ${l.cost}</button></div>`).join('');const rodNotice=!save.rodOwned?`<p class="bigLoss">🎣 YOUR ROD IS GONE.</p><p><b>Basic Ice Rod replacement: FREE.</b></p><p class="small">If you lost purchased gear, it must be bought again.</p><button id="replaceRod">GRAB FREE ICE ROD</button>`:'';panel.innerHTML=`<h1>Tackle Shop</h1><p>Coins: <b>${save.coins}</b></p>${rodNotice}<h3>Gear</h3><div class="grid">${gCards}</div><h3>Lures</h3><div class="grid">${lureCards}</div><div class="flex">${menuButton('BACK','back')}</div>`;document.querySelectorAll('.gearBtn').forEach(b=>b.onclick=()=>gearAction(b.dataset.id));document.querySelectorAll('.buyLure').forEach(b=>b.onclick=()=>buyLure(b.dataset.id));const rr=document.getElementById('replaceRod');if(rr)rr.onclick=replaceRod;document.getElementById('back').onclick=renderMenu}
function gearAction(id){const g=gears[id];if(!g)return;if(save.ownedGear.includes(id)){save.selectedGear=id;persist();renderShop();return}if(save.coins<g.cost){toast('Need '+g.cost+' coins.');return}save.coins-=g.cost;save.ownedGear.push(id);save.selectedGear=id;persist();renderShop()}
function buyLure(id){const l=lures[id];if(save.coins<l.cost){toast('Need '+l.cost+' coins.');return}save.coins-=l.cost;save.lures[id]=(save.lures[id]||0)+3;persist();renderShop()}
function replaceRod(){save.rodOwned=true;save.selectedGear='ice';save.lostGear=null;if(!save.ownedGear.includes('ice'))save.ownedGear.push('ice');persist();renderShop()}
function startRound(){if(!save.rodOwned){renderShop();return}score=0;timeLeft=105;roundCaught=0;rodLossThisRound=0;state='idle';fish=null;tension=0;reeling=false;ambientFish=[];for(let i=0;i<6;i++)ambientFish.push({x:rand(20,W-20),y:rand(waterTop+85,H-110),vx:rand(-18,18),s:rand(.65,1.15),phase:rand(0,6.28)});hook.x=W*.5;hook.y=waterTop+30;spawnTimer=0;overlay.style.display='none';bottom.style.display='flex';lureBar.style.display='flex';tensionBox.style.display='none';running=true;paused=false;last=performance.now();updateHUD();requestAnimationFrame(loop)}
function chooseFish(){let roll=Math.random(),id;if(selectedLure==='worm'){id=roll<.55?'trout':roll<.86?'salmon':roll<.97?'cod':'halibut'}else{id=roll<.43?'trout':roll<.78?'salmon':roll<.94?'cod':'halibut'}const s=species[id];let lureFit=s.likes.includes(selectedLure)?1:.48;if(selectedLure==='worm')lureFit=.78;if(Math.random()>lureFit)return null;const weight=rand(s.min,s.max);const power=s.power*(.80+.38*(weight-s.min)/(s.max-s.min));return {id,name:s.name,weight,power,stamina:s.stamina*(.78+.22*Math.random()),maxStamina:s.stamina,color:s.color,style:s.style,rodThief:s.rodThief||0,distance:rand(48,82),phase:rand(0,6.28),burst:0,rodRollDone:false}}
function doCast(){if(!running||paused||!save.rodOwned||state!=='idle')return;if(selectedLure!=='worm'&&(save.lures[selectedLure]||0)<=0){toast("You're out of "+lures[selectedLure].name+'s.');return}state='waiting';hook.x=rand(W*.28,W*.78);hook.y=waterTop+75;spawnTimer=rand(.45,1.25);toast('Lure down...')}
function hookFish(){const f=chooseFish();if(!f){state='idle';hook.y=waterTop+30;toast('Nothing liked that cast.');return}fish=f;state='hooked';tension=28;showFish();tensionBox.style.display='block';toast('FISH ON! '+fish.name)}
function loseLure(reason){if(selectedLure!=='worm')save.lures[selectedLure]=Math.max(0,(save.lures[selectedLure]||0)-1);persist();fish=null;state='idle';tension=0;reeling=false;showFish();tensionBox.style.display='none';hook.y=waterTop+30;toast(selectedLure==='worm'?reason+' Grab another free worm.':reason+' Lost the '+lures[selectedLure].name+'.',1900);updateHUD()}
function loseRod(){if(!fish)return;const wasCod=fish.id==='cod',lostId=save.selectedGear,lost=gears[lostId];save.rodOwned=false;save.lostGear=lostId;save.rodLosses++;rodLossThisRound++;if(lostId!=='ice')save.ownedGear=save.ownedGear.filter(x=>x!==lostId);persist();running=false;bottom.style.display='none';lureBar.style.display='none';tensionBox.style.display='none';fishCard.style.display='none';overlay.style.display='grid';panel.innerHTML=`<p class="bigLoss">🎣 ROD OVERBOARD!</p><h2>${fish.name} just stole your ${lost.name}.</h2><p>${wasCod?"A COD. Seriously. We're not telling Dave about this.":'Somewhere in Cook Inlet, a fish now owns your fishing gear.'}</p><p>${lostId==='ice'?'The basic ice rod is free. Pride is not included.':"That was paid gear. If you want another one, you're buying it again."}</p><div class="stats"><div class="stat"><b>Coins</b><br>${save.coins}</div><div class="stat"><b>Lost</b><br>${lost.name}</div></div><div class="flex">${menuButton('TACKLE SHOP','toShop')}</div>`;document.getElementById('toShop').onclick=renderShop;fish=null}
function landFish(){const s=species[fish.id],payout=Math.max(3,Math.round(s.value+fish.weight*.42));score+=Math.round(fish.weight*2)+20;save.coins+=payout;save.totalFish++;roundCaught++;const prev=save.records[fish.name]||0;if(fish.weight>prev)save.records[fish.name]=fish.weight;if(!save.biggest||fish.weight>save.biggest.weight)save.biggest={name:fish.name,weight:fish.weight};toast(`LANDED ${fmtWeight(fish.weight)} ${fish.name} · +${payout} coins`,1900);fish=null;state='idle';tension=0;reeling=false;showFish();tensionBox.style.display='none';hook.y=waterTop+30;persist();updateHUD()}
function endRound(){running=false;bottom.style.display='none';lureBar.style.display='none';tensionBox.style.display='none';fishCard.style.display='none';save.best=Math.max(save.best,score);persist();overlay.style.display='grid';panel.innerHTML=`<h1>Round Complete</h1><div class="stats"><div class="stat"><b>Score</b><br>${score}</div><div class="stat"><b>Fish landed</b><br>${roundCaught}</div><div class="stat"><b>Coins</b><br>${save.coins}</div><div class="stat"><b>Rods lost</b><br>${rodLossThisRound}</div></div><div class="flex">${menuButton('FISH AGAIN','again')}${menuButton('MENU','menu')}</div>`;document.getElementById('again').onclick=()=>save.rodOwned?startRound():renderShop();document.getElementById('menu').onclick=renderMenu}
function update(dt){if(state==='waiting'){spawnTimer-=dt;if(spawnTimer<=0)hookFish()}if(fish){fish.phase+=dt*(1.5+fish.power*2.3);fish.stamina=Math.max(0,fish.stamina);const exhausted=fish.stamina<=0;const sizeLoad=clamp(fish.weight/70,.03,1.35);if(!exhausted){if(Math.random()<dt*(.30+fish.power*.28))fish.burst=rand(.40,.95);if(fish.burst>0)fish.burst-=dt;const burst=fish.burst>0?1.45:1;const staminaFrac=clamp(fish.stamina/fish.maxStamina,.05,1);const pull=fish.power*burst*(.42+.58*staminaFrac);if(reeling){let baseRetrieve=38;if(fish.id==='trout')baseRetrieve=58;else if(fish.id==='salmon')baseRetrieve=28;else if(fish.id==='cod')baseRetrieve=24;else if(fish.id==='halibut')baseRetrieve=15;const tackleEdge=gear().reel;const resistance=clamp(1.08-pull*.34,.42,1.0);fish.distance-=dt*baseRetrieve*tackleEdge*resistance;tension+=dt*(12*pull+5+sizeLoad*7);let tire=9;if(fish.id==='trout')tire=14;else if(fish.id==='salmon')tire=10;else if(fish.id==='cod')tire=9;else if(fish.id==='halibut')tire=7;fish.stamina-=dt*(tire+8*tension/gear().tolerance);if(fish.stamina<=0){fish.stamina=0;fish.burst=0;toast('FISH EXHAUSTED — fight is over, now haul the weight.',1350)}}else{let run=4+12*pull;if(fish.id==='halibut')run*=1.18;if(fish.id==='trout')run*=.75;fish.distance+=dt*run;tension-=dt*30;let recovery=3.0;if(fish.id==='trout')recovery=2.2;else if(fish.id==='salmon')recovery=4.0;else if(fish.id==='cod')recovery=4.4;else if(fish.id==='halibut')recovery=5.0;fish.stamina=Math.min(fish.maxStamina,fish.stamina+dt*recovery)}}else{fish.burst=0;const weightTension=9+sizeLoad*45;if(reeling){let haul=66-fish.weight*.48;haul=clamp(haul,20,64)*gear().reel;fish.distance-=dt*haul;tension+=(weightTension-tension)*Math.min(1,dt*4.2)}else{tension+=((weightTension*.72)-tension)*Math.min(1,dt*3.2)}}tension=clamp(tension,0,gear().tolerance+36);fish.distance=clamp(fish.distance,0,175);const pct=clamp(tension/gear().tolerance,0,1.25);tensionFill.style.width=(Math.min(1,pct)*100)+'%';showFish();if(fish.stamina>0&&fish.burst>0&&!fish.rodRollDone&&reeling&&pct>.56&&(fish.id==='cod'||fish.id==='halibut')){fish.rodRollDone=true;let chance=fish.id==='halibut'?.68:.30;chance*=gear().rodRisk;chance*=clamp(.90+fish.weight/110,.95,1.55);if(Math.random()<chance){loseRod();return}}if(fish.burst<=0)fish.rodRollDone=false;if(tension>gear().tolerance+30){loseLure('SNAP!');return}if(fish.distance>=174){loseLure('Fish ran you out.');return}if(fish.distance<=5){landFish();return}}timeLeft-=dt;if(timeLeft<=0){endRound();return}updateHUD()}
function drawFishShape(px,py,len,ht,color,right){ctx.save();ctx.translate(px,py);ctx.scale(right?1:-1,1);ctx.fillStyle=color;ctx.beginPath();ctx.ellipse(0,0,len*.55,ht,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.moveTo(-len*.5,0);ctx.lineTo(-len*.85,-ht*.9);ctx.lineTo(-len*.82,ht*.9);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(len*.3,-ht*.18,2.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(len*.31,-ht*.18,1.2,0,Math.PI*2);ctx.fill();ctx.restore()}
function draw(){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#8bdcf2');g.addColorStop(.37,'#d8eff4');g.addColorStop(.371,'#237a9a');g.addColorStop(1,'#063a56');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle='#6f8790';ctx.beginPath();ctx.moveTo(0,waterTop);ctx.lineTo(0,waterTop-75);ctx.lineTo(W*.16,waterTop-115);ctx.lineTo(W*.29,waterTop-64);ctx.lineTo(W*.43,waterTop-138);ctx.lineTo(W*.58,waterTop-70);ctx.lineTo(W*.74,waterTop-124);ctx.lineTo(W,waterTop-62);ctx.lineTo(W,waterTop);ctx.closePath();ctx.fill();ctx.fillStyle='#d9ecf0';ctx.beginPath();ctx.moveTo(W*.33,waterTop-85);ctx.lineTo(W*.43,waterTop-138);ctx.lineTo(W*.51,waterTop-96);ctx.lineTo(W*.43,waterTop-112);ctx.closePath();ctx.fill();ctx.strokeStyle='#8fd6e6';ctx.globalAlpha=.25;ctx.lineWidth=1;for(let y=waterTop+30;y<H;y+=35){ctx.beginPath();for(let xx=0;xx<W;xx+=45){ctx.moveTo(xx,y);ctx.lineTo(xx+25,y+Math.sin((xx+y)*.04)*3)}ctx.stroke()}ctx.globalAlpha=1;ambientFish.forEach(a=>{a.x+=a.vx*.016;if(a.x<-25)a.x=W+25;if(a.x>W+25)a.x=-25;drawFishShape(a.x,a.y+Math.sin(performance.now()/800+a.phase)*5,22*a.s,10*a.s,'#3b6e76',a.vx>=0)});ctx.fillStyle='#7c4c24';ctx.beginPath();ctx.moveTo(W*.08,waterTop-18);ctx.lineTo(W*.34,waterTop-18);ctx.lineTo(W*.30,waterTop+18);ctx.lineTo(W*.12,waterTop+18);ctx.closePath();ctx.fill();const cx=W*.20,cy=waterTop-82;ctx.strokeStyle='#1a2226';ctx.lineWidth=5;ctx.lineCap='round';ctx.beginPath();ctx.arc(cx,cy-36,15,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(cx,cy-20);ctx.lineTo(cx,cy+28);ctx.moveTo(cx,cy-4);ctx.lineTo(cx-25,cy+10);ctx.moveTo(cx,cy-2);ctx.lineTo(cx+24,cy+7);ctx.moveTo(cx,cy+28);ctx.lineTo(cx-18,cy+58);ctx.moveTo(cx,cy+28);ctx.lineTo(cx+17,cy+58);ctx.stroke();ctx.strokeStyle='#f1ad2d';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(cx-14,cy-50);ctx.lineTo(cx+13,cy-50);ctx.lineTo(cx+22,cy-46);ctx.stroke();if(save.rodOwned){ctx.strokeStyle='#263239';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(cx+23,cy+7);ctx.quadraticCurveTo(W*.43,waterTop-115,hook.x,hook.y);ctx.stroke()}if(fish){const fx=clamp(W*.50+Math.sin(fish.phase)*W*.22,35,W-35),fy=waterTop+110+clamp(fish.distance,0,150)*2.1;drawFishShape(fx,Math.min(H-80,fy),Math.min(55,24+fish.weight*.28),Math.min(24,11+fish.weight*.10),fish.color,Math.sin(fish.phase)>=0)}if(save.rodOwned){ctx.strokeStyle='#333';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(hook.x,hook.y-9);ctx.lineTo(hook.x,hook.y+7);ctx.arc(hook.x+6,hook.y+7,6,Math.PI,0);ctx.stroke();ctx.fillStyle=selectedLure==='jig'?'#d63e33':selectedLure==='spoon'?'#d9d9d9':'#e4bd27';ctx.beginPath();ctx.arc(hook.x-2,hook.y-10,5,0,Math.PI*2);ctx.fill()}ctx.textAlign='center';ctx.font='900 24px Trebuchet MS';ctx.lineWidth=5;ctx.strokeStyle='#49300f';ctx.fillStyle='#f4ad2d';ctx.strokeText('CAPTAIN KINCHELOE',W/2,105);ctx.fillText('CAPTAIN KINCHELOE',W/2,105);if(running&&state==='idle'){ctx.font='900 16px Trebuchet MS';ctx.lineWidth=4;ctx.strokeStyle='#0c4257';ctx.fillStyle='#fff';ctx.strokeText('CAST WHEN READY',W/2,132);ctx.fillText('CAST WHEN READY',W/2,132)}}
function loop(now){if(!running)return;const dt=Math.min(.034,(now-last)/1000||0);last=now;if(!paused){update(dt);if(running)draw()}if(running)requestAnimationFrame(loop)}
castBtn.addEventListener('click',doCast);const down=e=>{e.preventDefault();if(running&&!paused&&fish)reeling=true},up=e=>{e.preventDefault();reeling=false};reelBtn.addEventListener('pointerdown',down);reelBtn.addEventListener('pointerup',up);reelBtn.addEventListener('pointercancel',up);reelBtn.addEventListener('pointerleave',up);reelBtn.addEventListener('touchstart',down,{passive:false});reelBtn.addEventListener('touchend',up,{passive:false});pauseBtn.onclick=()=>{if(!running)return;paused=!paused;if(paused){overlay.style.display='grid';panel.innerHTML=`<h1>Paused</h1><p>Captain Kincheloe is calling this strategy.</p><div class="flex">${menuButton('RESUME','resume')}${menuButton('QUIT','quit')}</div>`;document.getElementById('resume').onclick=()=>{overlay.style.display='none';paused=false;last=performance.now();requestAnimationFrame(loop)};document.getElementById('quit').onclick=()=>{running=false;renderMenu()}}};document.querySelectorAll('.lureBtn').forEach(b=>b.onclick=()=>{if(state!=='idle')return;selectedLure=b.dataset.lure;document.querySelectorAll('.lureBtn').forEach(q=>q.classList.toggle('active',q===b));updateHUD()});document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused){paused=true;reeling=false;overlay.style.display='grid';panel.innerHTML=`<h1>Paused</h1><p>The fish are waiting.</p><div class="flex">${menuButton('RESUME','resume')}${menuButton('QUIT','quit')}</div>`;document.getElementById('resume').onclick=()=>{overlay.style.display='none';paused=false;last=performance.now();requestAnimationFrame(loop)};document.getElementById('quit').onclick=()=>{running=false;renderMenu()}}});renderMenu();draw();
})();
